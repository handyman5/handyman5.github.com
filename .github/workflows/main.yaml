on: [push]

jobs:
  nikola_build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pages: write
    name: 'Deploy Nikola to GitHub Pages'

    steps:
    - name: Check out
      uses: actions/checkout@v4

    - name: Install System Dependencies (Emacs)
      run: |
        sudo apt-get update
        sudo apt-get install -y emacs-nox

    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "latest"
        enable-cache: true
        python-version: "3.11"

    # We use 'uv run' to execute the build inside an isolated environment on the fly
    - name: Build Nikola Site
      run: |
        uv run --with "Nikola[extras]" nikola build

    # Your custom asset sync step preserved exactly as intended
    - name: Copy Plugin Assets
      run: |-
        sudo chmod -R o+w output
        rsync -rvP --inplace --mkpath plugins/*/files/ output/

    # Upload the final output directory directly to GitHub's deployment engine
    - name: Upload Site
      uses: actions/upload-pages-artifact@v3
      with:
        path: "output"

    # Instruct GitHub Pages to go live
    - name: Publish Site
      uses: actions/deploy-pages@v4


