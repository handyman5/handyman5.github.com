on: [push]

jobs:
  nikola_build:
    runs-on: ubuntu-latest
    #container: ghcr.io/handyman5/blog@sha256:167b597df57d3231749c1677cdff2b9e552f68003732893ede98f9709aa26ec9
    permissions:
      contents: write
      id-token: write
      pages: write
    name: 'Deploy Nikola to GitHub Pages'
    steps:
    - name: Install APT Packages
      run: |
        sudo apt-get update
        sudo apt-get install -y emacs-nox
        which emacs
        emacs --version
    - name: Check out repo
      uses: actions/checkout@v6
    # - name: Setup Python
    #   uses: actions/setup-python@v5
    #   with:
    #     python-version: '3.11'
    #     cache: 'pip'
    # - name: Install Nikola
    #   run: pip install "Nikola[extras]"

    - name: Clean Diagnostics for Nikola Org-mode
      continue-on-error: true
      run: |
        echo "=== 1. CHECKING EXECUTABLE PATHS ==="
        echo "Current PATH: $PATH"
        echo "Which emacs: $(which emacs || echo 'NOT FOUND')"
        
        echo -e "\n=== 2. PYTHON ENVIRONMENT ==="
        python3 -c "import shutil; print('Can Python find emacs?:', shutil.which('emacs'))"
        
        echo -e "\n=== 3. EMACS NATIVE ORG CHECK ==="
        emacs --batch --no-init-file --eval '
          (condition-case err
              (progn
                (require '\''org)
                (message "SUCCESS: Org-mode version %s is available!" (org-version)))
            (error
              (message "FAILURE: Could not load org. Error: %s" err)))
        '

        echo -e "\n=== 4. SIMULATING FULL SUBPROCESS CALL ==="
        python3 -c "import subprocess; print('Result:', subprocess.check_output(['emacs', '--batch', '--eval', '(message \"Python Subprocess OK\")'], stderr=subprocess.STDOUT).decode().strip())"



    - name: Build and Deploy Nikola
      uses: getnikola/nikola-action@v8
      with:
        dry_run: true
    - name: Copy Plugin Assets
      run: |-
        sudo chmod -R o+w output
        rsync -rvP --inplace --mkpath plugins/*/files/ output/
    - name: Upload Site
      uses: actions/upload-pages-artifact@v3
      with:
        path: "output"
    - name: Publish Site
      uses: actions/deploy-pages@v4
